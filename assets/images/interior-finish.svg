<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="interiorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8d4c4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4b5a0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Interior finish background -->
  <rect width="800" height="600" fill="url(#interiorGrad)"/>
  
  <!-- Wood flooring pattern -->
  <g id="flooring" opacity="0.7">
    <rect x="0" y="0" width="150" height="100" fill="#8b6f47" stroke="#6b5436" stroke-width="1"/>
    <rect x="150" y="0" width="150" height="100" fill="#a0845a" stroke="#6b5436" stroke-width="1"/>
    <rect x="300" y="0" width="150" height="100" fill="#8b6f47" stroke="#6b5436" stroke-width="1"/>
    <rect x="450" y="0" width="150" height="100" fill="#a0845a" stroke="#6b5436" stroke-width="1"/>
    <rect x="600" y="0" width="200" height="100" fill="#8b6f47" stroke="#6b5436" stroke-width="1"/>
    
    <rect x="0" y="100" width="150" height="100" fill="#a0845a" stroke="#6b5436" stroke-width="1"/>
    <rect x="150" y="100" width="150" height="100" fill="#8b6f47" stroke="#6b5436" stroke-width="1"/>
    <rect x="300" y="100" width="150" height="100" fill="#a0845a" stroke="#6b5436" stroke-width="1"/>
    <rect x="450" y="100" width="150" height="100" fill="#8b6f47" stroke="#6b5436" stroke-width="1"/>
    <rect x="600" y="100" width="200" height="100" fill="#a0845a" stroke="#6b5436" stroke-width="1"/>
    
    <rect x="0" y="200" width="150" height="100" fill="#8b6f47" stroke="#6b5436" stroke-width="1"/>
    <rect x="150" y="200" width="150" height="100" fill="#a0845a" stroke="#6b5436" stroke-width="1"/>
    <rect x="300" y="200" width="150" height="100" fill="#8b6f47" stroke="#6b5436" stroke-width="1"/>
    <rect x="450" y="200" width="150" height="100" fill="#a0845a" stroke="#6b5436" stroke-width="1"/>
    <rect x="600" y="200" width="200" height="100" fill="#8b6f47" stroke="#6b5436" stroke-width="1"/>
    
    <rect x="0" y="300" width="150" height="100" fill="#a0845a" stroke="#6b5436" stroke-width="1"/>
    <rect x="150" y="300" width="150" height="100" fill="#8b6f47" stroke="#6b5436" stroke-width="1"/>
    <rect x="300" y="300" width="150" height="100" fill="#a0845a" stroke="#6b5436" stroke-width="1"/>
    <rect x="450" y="300" width="150" height="100" fill="#8b6f47" stroke="#6b5436" stroke-width="1"/>
    <rect x="600" y="300" width="200" height="100" fill="#a0845a" stroke="#6b5436" stroke-width="1"/>
    
    <rect x="0" y="400" width="150" height="100" fill="#8b6f47" stroke="#6b5436" stroke-width="1"/>
    <rect x="150" y="400" width="150" height="100" fill="#a0845a" stroke="#6b5436" stroke-width="1"/>
    <rect x="300" y="400" width="150" height="100" fill="#8b6f47" stroke="#6b5436" stroke-width="1"/>
    <rect x="450" y="400" width="150" height="100" fill="#a0845a" stroke="#6b5436" stroke-width="1"/>
    <rect x="600" y="400" width="200" height="100" fill="#8b6f47" stroke="#6b5436" stroke-width="1"/>
    
    <rect x="0" y="500" width="150" height="100" fill="#a0845a" stroke="#6b5436" stroke-width="1"/>
    <rect x="150" y="500" width="150" height="100" fill="#8b6f47" stroke="#6b5436" stroke-width="1"/>
    <rect x="300" y="500" width="150" height="100" fill="#a0845a" stroke="#6b5436" stroke-width="1"/>
    <rect x="450" y="500" width="150" height="100" fill="#8b6f47" stroke="#6b5436" stroke-width="1"/>
    <rect x="600" y="500" width="200" height="100" fill="#a0845a" stroke="#6b5436" stroke-width="1"/>
  </g>
  
  <!-- Wooden beams -->
  <g id="beams" opacity="0.4">
    <rect x="50" y="150" width="200" height="20" fill="#6b5436"/>
    <rect x="550" y="300" width="150" height="25" fill="#6b5436"/>
  </g>
  
  <!-- Text overlay -->
  <text x="400" y="550" font-size="24" text-anchor="middle" fill="#5a4a3a" opacity="0.7" font-family="Arial">Interior Finishing & Furnishings</text>
</svg>
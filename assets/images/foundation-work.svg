<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="brickGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c97a4f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a0562e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Brick wall pattern - Foundation work -->
  <rect width="800" height="600" fill="url(#brickGrad)"/>
  
  <!-- Brick pattern -->
  <g id="bricks" opacity="0.8">
    <g id="row1">
      <rect x="10" y="10" width="90" height="40" fill="#d97d53" stroke="#8b5a3c" stroke-width="2"/>
      <rect x="110" y="10" width="90" height="40" fill="#d97d53" stroke="#8b5a3c" stroke-width="2"/>
      <rect x="210" y="10" width="90" height="40" fill="#d97d53" stroke="#8b5a3c" stroke-width="2"/>
      <rect x="310" y="10" width="90" height="40" fill="#d97d53" stroke="#8b5a3c" stroke-width="2"/>
      <rect x="410" y="10" width="90" height="40" fill="#d97d53" stroke="#8b5a3c" stroke-width="2"/>
      <rect x="510" y="10" width="90" height="40" fill="#d97d53" stroke="#8b5a3c" stroke-width="2"/>
      <rect x="610" y="10" width="90" height="40" fill="#d97d53" stroke="#8b5a3c" stroke-width="2"/>
    </g>
    <g id="row2">
      <rect x="60" y="60" width="90" height="40" fill="#d97d53" stroke="#8b5a3c" stroke-width="2"/>
      <rect x="160" y="60" width="90" height="40" fill="#d97d53" stroke="#8b5a3c" stroke-width="2"/>
      <rect x="260" y="60" width="90" height="40" fill="#d97d53" stroke="#8b5a3c" stroke-width="2"/>
      <rect x="360" y="60" width="90" height="40" fill="#d97d53" stroke="#8b5a3c" stroke-width="2"/>
      <rect x="460" y="60" width="90" height="40" fill="#d97d53" stroke="#8b5a3c" stroke-width="2"/>
      <rect x="560" y="60" width="90" height="40" fill="#d97d53" stroke="#8b5a3c" stroke-width="2"/>
      <rect x="660" y="60" width="90" height="40" fill="#d97d53" stroke="#8b5a3c" stroke-width="2"/>
    </g>
  </g>
  
  <!-- Cement/concrete spots -->
  <circle cx="150" cy="150" r="15" fill="#888" opacity="0.3"/>
  <circle cx="500" cy="250" r="12" fill="#999" opacity="0.3"/>
  <circle cx="700" cy="180" r="18" fill="#777" opacity="0.3"/>
  <circle cx="300" cy="400" r="10" fill="#888" opacity="0.3"/>
  
  <!-- Text overlay -->
  <text x="400" y="550" font-size="24" text-anchor="middle" fill="#666" opacity="0.6" font-family="Arial">Foundation & Masonry Work</text>
</svg>
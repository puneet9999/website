<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#E0F6FF;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#F5F5DC;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="buildingGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A574;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#A0805A;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="buildingGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C9A876;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#9B7D5D;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Sky -->
  <rect width="1920" height="1080" fill="url(#skyGrad)"/>
  
  <!-- Sun -->
  <circle cx="1700" cy="120" r="60" fill="#FFD700" opacity="0.8"/>
  <circle cx="1700" cy="120" r="65" fill="#FFA500" opacity="0.3"/>
  
  <!-- Clouds -->
  <g opacity="0.4">
    <ellipse cx="200" cy="150" rx="80" ry="40" fill="#FFFFFF"/>
    <ellipse cx="250" cy="140" rx="60" ry="35" fill="#FFFFFF"/>
    <ellipse cx="150" cy="160" rx="50" ry="30" fill="#FFFFFF"/>
  </g>
  <g opacity="0.3">
    <ellipse cx="1600" cy="200" rx="100" ry="45" fill="#FFFFFF"/>
    <ellipse cx="1670" cy="190" rx="70" ry="35" fill="#FFFFFF"/>
  </g>
  
  <!-- Ground -->
  <rect y="800" width="1920" height="280" fill="#B8A887"/>
  <rect y="850" width="1920" height="230" fill="#A89968"/>
  
  <!-- Building 1 (Main) -->
  <g filter="url(#shadow)">
    <rect x="200" y="350" width="600" height="500" fill="url(#buildingGrad1)"/>
    <!-- Floors -->
    <line x1="200" y1="450" x2="800" y2="450" stroke="#8B7355" stroke-width="8"/>
    <line x1="200" y1="550" x2="800" y2="550" stroke="#8B7355" stroke-width="8"/>
    <line x1="200" y1="650" x2="800" y2="650" stroke="#8B7355" stroke-width="8"/>
    <line x1="200" y1="750" x2="800" y2="750" stroke="#8B7355" stroke-width="8"/>
    
    <!-- Windows Floor 1 -->
    <rect x="250" y="380" width="40" height="40" fill="#87CEEB" stroke="#333" stroke-width="2"/>
    <rect x="340" y="380" width="40" height="40" fill="#87CEEB" stroke="#333" stroke-width="2"/>
    <rect x="430" y="380" width="40" height="40" fill="#87CEEB" stroke="#333" stroke-width="2"/>
    <rect x="520" y="380" width="40" height="40" fill="#87CEEB" stroke="#333" stroke-width="2"/>
    <rect x="610" y="380" width="40" height="40" fill="#87CEEB" stroke="#333" stroke-width="2"/>
    
    <!-- Windows Floor 2 -->
    <rect x="250" y="480" width="40" height="40" fill="#87CEEB" stroke="#333" stroke-width="2"/>
    <rect x="340" y="480" width="40" height="40" fill="#87CEEB" stroke="#333" stroke-width="2"/>
    <rect x="430" y="480" width="40" height="40" fill="#87CEEB" stroke="#333" stroke-width="2"/>
    <rect x="520" y="480" width="40" height="40" fill="#87CEEB" stroke="#333" stroke-width="2"/>
    <rect x="610" y="480" width="40" height="40" fill="#87CEEB" stroke="#333" stroke-width="2"/>
    
    <!-- Windows Floor 3 -->
    <rect x="250" y="580" width="40" height="40" fill="#87CEEB" stroke="#333" stroke-width="2"/>
    <rect x="340" y="580" width="40" height="40" fill="#87CEEB" stroke="#333" stroke-width="2"/>
    <rect x="430" y="580" width="40" height="40" fill="#87CEEB" stroke="#333" stroke-width="2"/>
    <rect x="520" y="580" width="40" height="40" fill="#87CEEB" stroke="#333" stroke-width="2"/>
    <rect x="610" y="580" width="40" height="40" fill="#87CEEB" stroke="#333" stroke-width="2"/>
    
    <!-- Windows Floor 4 -->
    <rect x="250" y="680" width="40" height="40" fill="#87CEEB" stroke="#333" stroke-width="2"/>
    <rect x="340" y="680" width="40" height="40" fill="#87CEEB" stroke="#333" stroke-width="2"/>
    <rect x="430" y="680" width="40" height="40" fill="#87CEEB" stroke="#333" stroke-width="2"/>
    <rect x="520" y="680" width="40" height="40" fill="#87CEEB" stroke="#333" stroke-width="2"/>
    <rect x="610" y="680" width="40" height="40" fill="#87CEEB" stroke="#333" stroke-width="2"/>
  </g>
  
  <!-- Building 2 (Secondary) -->
  <g filter="url(#shadow)">
    <rect x="1000" y="450" width="550" height="400" fill="url(#buildingGrad2)"/>
    <!-- Floors -->
    <line x1="1000" y1="550" x2="1550" y2="550" stroke="#8B7355" stroke-width="8"/>
    <line x1="1000" y1="650" x2="1550" y2="650" stroke="#8B7355" stroke-width="8"/>
    <line x1="1000" y1="750" x2="1550" y2="750" stroke="#8B7355" stroke-width="8"/>
    
    <!-- Windows Floor 1 -->
    <rect x="1050" y="480" width="40" height="40" fill="#87CEEB" stroke="#333" stroke-width="2"/>
    <rect x="1140" y="480" width="40" height="40" fill="#87CEEB" stroke="#333" stroke-width="2"/>
    <rect x="1230" y="480" width="40" height="40" fill="#87CEEB" stroke="#333" stroke-width="2"/>
    <rect x="1320" y="480" width="40" height="40" fill="#87CEEB" stroke="#333" stroke-width="2"/>
    <rect x="1410" y="480" width="40" height="40" fill="#87CEEB" stroke="#333" stroke-width="2"/>
    
    <!-- Windows Floor 2 -->
    <rect x="1050" y="580" width="40" height="40" fill="#87CEEB" stroke="#333" stroke-width="2"/>
    <rect x="1140" y="580" width="40" height="40" fill="#87CEEB" stroke="#333" stroke-width="2"/>
    <rect x="1230" y="580" width="40" height="40" fill="#87CEEB" stroke="#333" stroke-width="2"/>
    <rect x="1320" y="580" width="40" height="40" fill="#87CEEB" stroke="#333" stroke-width="2"/>
    <rect x="1410" y="580" width="40" height="40" fill="#87CEEB" stroke="#333" stroke-width="2"/>
    
    <!-- Windows Floor 3 -->
    <rect x="1050" y="680" width="40" height="40" fill="#87CEEB" stroke="#333" stroke-width="2"/>
    <rect x="1140" y="680" width="40" height="40" fill="#87CEEB" stroke="#333" stroke-width="2"/>
    <rect x="1230" y="680" width="40" height="40" fill="#87CEEB" stroke="#333" stroke-width="2"/>
    <rect x="1320" y="680" width="40" height="40" fill="#87CEEB" stroke="#333" stroke-width="2"/>
    <rect x="1410" y="680" width="40" height="40" fill="#87CEEB" stroke="#333" stroke-width="2"/>
  </g>
  
  <!-- Crane Tower -->
  <rect x="750" y="150" width="20" height="700" fill="#555555"/>
  <!-- Crane Jib -->
  <rect x="750" y="180" width="400" height="15" fill="#666666"/>
  <!-- Crane Hook -->
  <circle cx="1100" cy="240" r="15" fill="#FFD700"/>
  <line x1="1100" y1="255" x2="1100" y2="320" stroke="#333" stroke-width="3" stroke-dasharray="5,5"/>
  
  <!-- Scaffolding -->
  <rect x="900" y="700" width="80" height="150" fill="#FF8C00" opacity="0.7"/>
  <line x1="900" y1="720" x2="980" y2="720" stroke="#333" stroke-width="2"/>
  <line x1="900" y1="750" x2="980" y2="750" stroke="#333" stroke-width="2"/>
  <line x1="900" y1="780" x2="980" y2="780" stroke="#333" stroke-width="2"/>
  <line x1="900" y1="810" x2="980" y2="810" stroke="#333" stroke-width="2"/>
  <line x1="930" y1="700" x2="930" y2="850" stroke="#333" stroke-width="2"/>
  <line x1="950" y1="700" x2="950" y2="850" stroke="#333" stroke-width="2"/>
  
  <!-- Construction Materials (Stacked) -->
  <rect x="1650" y="750" width="100" height="30" fill="#8B4513" stroke="#333" stroke-width="2"/>
  <rect x="1650" y="785" width="100" height="30" fill="#A0522D" stroke="#333" stroke-width="2"/>
  <rect x="1650" y="820" width="100" height="30" fill="#8B4513" stroke="#333" stroke-width="2"/>
  
  <!-- Safety Cones -->
  <circle cx="400" cy="840" r="12" fill="#FF4500"/>
  <polygon points="400,828 394,840 406,840" fill="#FF4500"/>
  
  <!-- Workers (Simple circles) -->
  <circle cx="500" cy="800" r="8" fill="#FF69B4"/>
  <circle cx="750" cy="850" r="8" fill="#FF69B4"/>
  <circle cx="1200" cy="820" r="8" fill="#FF69B4"/>
  <circle cx="1450" cy="880" r="8" fill="#FF69B4"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#506078;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#364453;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Steel reinforcement background -->
  <rect width="800" height="600" fill="url(#steelGrad)"/>
  
  <!-- Rebar grid pattern -->
  <g id="rebar" opacity="0.6">
    <!-- Horizontal bars -->
    <line x1="0" y1="50" x2="800" y2="50" stroke="#d4af37" stroke-width="3"/>
    <line x1="0" y1="120" x2="800" y2="120" stroke="#d4af37" stroke-width="3"/>
    <line x1="0" y1="190" x2="800" y2="190" stroke="#d4af37" stroke-width="3"/>
    <line x1="0" y1="260" x2="800" y2="260" stroke="#d4af37" stroke-width="3"/>
    <line x1="0" y1="330" x2="800" y2="330" stroke="#d4af37" stroke-width="3"/>
    <line x1="0" y1="400" x2="800" y2="400" stroke="#d4af37" stroke-width="3"/>
    <line x1="0" y1="470" x2="800" y2="470" stroke="#d4af37" stroke-width="3"/>
    <line x1="0" y1="540" x2="800" y2="540" stroke="#d4af37" stroke-width="3"/>
    
    <!-- Vertical bars -->
    <line x1="50" y1="0" x2="50" y2="600" stroke="#d4af37" stroke-width="3"/>
    <line x1="120" y1="0" x2="120" y2="600" stroke="#d4af37" stroke-width="3"/>
    <line x1="190" y1="0" x2="190" y2="600" stroke="#d4af37" stroke-width="3"/>
    <line x1="260" y1="0" x2="260" y2="600" stroke="#d4af37" stroke-width="3"/>
    <line x1="330" y1="0" x2="330" y2="600" stroke="#d4af37" stroke-width="3"/>
    <line x1="400" y1="0" x2="400" y2="600" stroke="#d4af37" stroke-width="3"/>
    <line x1="470" y1="0" x2="470" y2="600" stroke="#d4af37" stroke-width="3"/>
    <line x1="540" y1="0" x2="540" y2="600" stroke="#d4af37" stroke-width="3"/>
    <line x1="610" y1="0" x2="610" y2="600" stroke="#d4af37" stroke-width="3"/>
    <line x1="680" y1="0" x2="680" y2="600" stroke="#d4af37" stroke-width="3"/>
    <line x1="750" y1="0" x2="750" y2="600" stroke="#d4af37" stroke-width="3"/>
  </g>
  
  <!-- Welding spots -->
  <circle cx="120" cy="120" r="6" fill="#ffed4e" opacity="0.8"/>
  <circle cx="190" cy="190" r="6" fill="#ffed4e" opacity="0.8"/>
  <circle cx="330" cy="260" r="6" fill="#ffed4e" opacity="0.8"/>
  <circle cx="470" cy="400" r="6" fill="#ffed4e" opacity="0.8"/>
  <circle cx="610" cy="330" r="6" fill="#ffed4e" opacity="0.8"/>
  <circle cx="750" cy="470" r="6" fill="#ffed4e" opacity="0.8"/>
  
  <!-- Text overlay -->
  <text x="400" y="550" font-size="24" text-anchor="middle" fill="#fff" opacity="0.6" font-family="Arial">Steel Reinforcement & RCC</text>
</svg>